name: P2-G Format Helper

on:
  push:
    branches:
      - codex/implement-p2-g-live-workspace-migration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/implement-p2-g-live-workspace-migration
      - uses: Scony/godot-gdscript-toolkit@master
        with:
          version: 4.*
      - name: Format P2-G files
        run: |
          gdformat \
            src/UI/UI.gd \
            src/UI/Workspace/WorkspaceBuiltinModules.gd \
            src/UI/Workspace/WorkspaceDockHost.gd \
            src/UI/Workspace/WorkspaceEditorMigration.gd \
            src/UI/Workspace/WorkspaceInteractionController.gd \
            src/UI/Workspace/WorkspaceModule.gd \
            src/UI/Workspace/WorkspaceWindowMenuBridge.gd \
            tests/unit/test_p2_g_live_workspace_migration.gd
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/UI/UI.gd \
            src/UI/Workspace/WorkspaceBuiltinModules.gd \
            src/UI/Workspace/WorkspaceDockHost.gd \
            src/UI/Workspace/WorkspaceEditorMigration.gd \
            src/UI/Workspace/WorkspaceInteractionController.gd \
            src/UI/Workspace/WorkspaceModule.gd \
            src/UI/Workspace/WorkspaceWindowMenuBridge.gd \
            tests/unit/test_p2_g_live_workspace_migration.gd
          git commit -m "style: apply gdformat to P2-G"
          git push origin HEAD:codex/implement-p2-g-live-workspace-migration
