name: C2 format capture

on:
  push:
    branches:
      - p1-c2-navigation-feel
    paths:
      - '.github/workflows/c2-format-capture.yml'

permissions:
  contents: write

jobs:
  format-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: p1-c2-navigation-feel
      - name: Install gdformat
        uses: Scony/godot-gdscript-toolkit@master
        with:
          version: '4.*'
      - name: Format C2 files
        run: gdformat src/InputAdapter/CanvasInputAdapter.gd tests/unit/test_canvas_navigation_feel.gd
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/InputAdapter/CanvasInputAdapter.gd tests/unit/test_canvas_navigation_feel.gd; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/InputAdapter/CanvasInputAdapter.gd tests/unit/test_canvas_navigation_feel.gd
          git commit -m "style: 应用 P1-C2 gdformat"
          git push origin HEAD:p1-c2-navigation-feel
