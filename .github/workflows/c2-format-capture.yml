name: C2 format capture

on:
  push:
    branches:
      - p1-c2-navigation-feel
    paths:
      - '.github/workflows/c2-format-capture.yml'

jobs:
  format-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install gdformat
        uses: Scony/godot-gdscript-toolkit@master
        with:
          version: '4.*'
      - name: Format C2 files
        run: gdformat src/InputAdapter/CanvasInputAdapter.gd tests/unit/test_canvas_navigation_feel.gd
      - name: Upload formatted adapter
        uses: actions/upload-artifact@v4
        with:
          name: c2-formatted-files
          path: |
            src/InputAdapter/CanvasInputAdapter.gd
            tests/unit/test_canvas_navigation_feel.gd
