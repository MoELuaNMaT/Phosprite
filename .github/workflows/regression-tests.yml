name: Regression Tests 🧪

# Runs the headless Phosprite contract suite on the pinned engine baseline.
# Feature branches validate through pull_request so one commit does not create
# duplicate push + PR runs. Long-lived product branches still validate on push.
on:
  push:
    branches:
      - master
      - main
      - phosprite-main
      - integration/phosprite-mainline
  pull_request:
    branches:
      - master
      - main
      - phosprite-main
    paths:
      - "src/**"
      - "addons/**"
      - "tests/**"
      - "project.godot"
      - "export_presets.cfg"
      - "scripts/ci/**"
      - ".github/workflows/regression-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  TEST_SCRIPT: res://tests/runner.gd
  TEST_FLAG: --phosprite-test-runner

jobs:
  regression-tests:
    name: Headless contract suite
    runs-on: ubuntu-latest
    container:
      image: docker://barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Import project resources
        run: bash scripts/ci/godot_import_gate.sh godot
      - name: Run contract suite
        run: godot --headless --path . --script "${TEST_SCRIPT}" -- "${TEST_FLAG}"
