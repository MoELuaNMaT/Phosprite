name: Regression Tests 🧪

# Runs the headless P0 contract suite (tests/runner.gd) on the frozen engine
# version. This is a required gate: the P0 plan forbids starting iPad UX work
# until the storage/identity contract is proven, so a red run here must block
# the branch.
on:
  push:
    branches-ignore:
      - gh-pages
      - l10n_master
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/regression-tests.yml"

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-tests
  cancel-in-progress: true

env:
  # Must match the current Phosprite engine baseline.
  GODOT_VERSION: 4.7.2
  TEST_SCRIPT: res://tests/runner.gd
  TEST_FLAG: --phosprite-test-runner

jobs:
  regression-tests:
    name: Headless contract suite
    runs-on: ubuntu-latest
    container:
      image: docker://barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Import project resources and validate scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/phosprite-godot-import.log
          if grep -E 'SCRIPT ERROR: (Parse Error|Compile Error)|ERROR: Failed to load script' /tmp/phosprite-godot-import.log; then
            echo "::error::GDScript compile or load errors detected during Godot import"
            exit 1
          fi
      - name: Run contract suite
        # The runner exits non-zero on any assertion failure, which fails the job.
        run: godot --headless --path . --script "${TEST_SCRIPT}" -- "${TEST_FLAG}"
