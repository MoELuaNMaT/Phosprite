name: Rebuild iOS icon source

on:
  push:
    branches: [ codex/palette-selection-follows-color ]
    paths:
      - .github/workflows/rebuild-ios-icon.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'ci(icon): rebuild iOS icon source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/palette-selection-follows-color

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild 1024px iOS icon with nearest-neighbor scaling
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src_path = Path("assets/graphics/icons/icon.png")
          dst_path = Path("assets/graphics/icons/ios/phosprite_ios_1024.png")

          with Image.open(src_path) as src:
              src.load()
              if src.size != (32, 32):
                  raise SystemExit(f"Expected 32x32 source icon, got {src.size}")
              rgba = src.convert("RGBA")
              resized = rgba.resize((1024, 1024), Image.Resampling.NEAREST)
              dst_path.parent.mkdir(parents=True, exist_ok=True)
              resized.save(dst_path, format="PNG", optimize=True)

          with Image.open(dst_path) as check:
              check.load()
              if check.size != (1024, 1024):
                  raise SystemExit(f"Generated icon has wrong size: {check.size}")
              if check.mode != "RGBA":
                  raise SystemExit(f"Generated icon has wrong mode: {check.mode}")
          PY

      - name: Commit rebuilt icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/graphics/icons/ios/phosprite_ios_1024.png
          if git diff --cached --quiet; then
            echo "Icon already matches generated output."
            exit 0
          fi
          git commit -m "fix(ios): rebuild 1024px icon from pixel source"
          git push origin HEAD:codex/palette-selection-follows-color
