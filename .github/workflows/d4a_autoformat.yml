name: D4-A temporary autoformat

on:
  push:
    branches:
      - p1-d4a-layer-touch-context

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p1-d4a-layer-touch-context
          fetch-depth: 0
      - uses: Scony/godot-gdscript-toolkit@master
        with:
          version: 4.*
      - name: Format D4-A files
        run: |
          gdformat src/UI/Timeline/LayerTouchAdapter.gd tests/unit/test_p1_d4a_layer_touch_context.gd
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UI/Timeline/LayerTouchAdapter.gd tests/unit/test_p1_d4a_layer_touch_context.gd
          git commit -m "style: format D4-A touch files"
          git push origin HEAD:p1-d4a-layer-touch-context
