name: P2-G Floating Collapse Contract Fix

on:
  push:
    branches:
      - codex/implement-p2-g-live-workspace-migration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/implement-p2-g-live-workspace-migration
          fetch-depth: 0
      - name: Align contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Make the older P2-C suite fully typed under Godot 4.6.3.
          p = Path('tests/unit/test_p2_c_workspace_surface.gd')
          text = p.read_text(encoding='utf-8')
          text = text.replace('var manager = workspace["manager"]', 'var manager: WorkspaceModuleManager = workspace["manager"]')
          text = text.replace('var host = workspace["host"]', 'var host: WorkspaceDockHost = workspace["host"]')
          text = text.replace('var surface = workspace["surface"]', 'var surface: WorkspaceSurface = workspace["surface"]')
          text = text.replace('var preview := manager.get_instance(Builtins.PREVIEW_ID)', 'var preview: WorkspaceModule = manager.get_instance(Builtins.PREVIEW_ID)')
          text = text.replace('var candidate := surface.update_module_drag(left_rect.get_center())', 'var candidate: Dictionary = surface.update_module_drag(left_rect.get_center())')
          text = text.replace('var restore := surface.get_restore_state(Builtins.PREVIEW_ID)', 'var restore: Dictionary = surface.get_restore_state(Builtins.PREVIEW_ID)')
          text = text.replace('var palette := manager.get_instance(Builtins.PALETTE_ID)', 'var palette: WorkspaceModule = manager.get_instance(Builtins.PALETTE_ID)')
          text = text.replace('var palette_content := palette.get_content()', 'var palette_content: Control = palette.get_content()')
          p.write_text(text, encoding='utf-8')

          # P2-G fixture has no SceneTree geometry. Assert preservation relative to the
          # actual pre-collapse float state rather than a requested absolute screen point.
          replace_once(
              'tests/unit/test_p2_g_live_workspace_migration.gd',
              '''\tvar target_rect := Rect2(320.0, 180.0, 360.0, 240.0)\n\tcheck_true(surface.float_module(Builtins.PREVIEW_ID, target_rect), "Preview should float")\n\tvar preview := manager.get_instance(Builtins.PREVIEW_ID)\n\tcheck_true(surface.collapse_module(Builtins.PREVIEW_ID), "floating Preview should collapse")\n\tcheck_true(surface.is_floating_collapsed(Builtins.PREVIEW_ID), "collapse should remain floating")\n\tcheck_eq(preview.position, target_rect.position, "collapsed bar should stay at its origin")\n\tcheck_eq(preview.size.x, target_rect.size.x, "collapsed bar should keep its width")\n\tcheck_true(\n\t\tnot interaction.get_tray().visible,\n\t\t"floating-origin collapse must not become a bottom tray text button"\n\t)\n\tcheck_true(surface.restore_module(Builtins.PREVIEW_ID), "collapsed floating bar should restore")\n\tcheck_eq(surface.get_floating_rect(Builtins.PREVIEW_ID), target_rect, "restore should recover full rect")\n''',
              '''\tvar target_rect := Rect2(320.0, 180.0, 360.0, 240.0)\n\tcheck_true(surface.float_module(Builtins.PREVIEW_ID, target_rect), "Preview should float")\n\tvar preview: WorkspaceModule = manager.get_instance(Builtins.PREVIEW_ID)\n\tvar actual_float_rect := surface.get_floating_rect(Builtins.PREVIEW_ID)\n\tvar before_position := preview.position\n\tvar before_width := preview.size.x\n\tcheck_true(surface.collapse_module(Builtins.PREVIEW_ID), "floating Preview should collapse")\n\tcheck_true(surface.is_floating_collapsed(Builtins.PREVIEW_ID), "collapse should remain floating")\n\tcheck_eq(preview.position, before_position, "collapsed bar should stay at its floating position")\n\tcheck_eq(preview.size.x, before_width, "collapsed bar should keep its floating width")\n\tcheck_eq(\n\t\t(surface.get_restore_state(Builtins.PREVIEW_ID).get("rect", Rect2()) as Rect2),\n\t\tactual_float_rect,\n\t\t"floating collapse should preserve the complete pre-collapse rectangle"\n\t)\n\tcheck_true(\n\t\tnot interaction.get_tray().visible,\n\t\t"floating-origin collapse must not become a bottom tray text button"\n\t)\n\tcheck_true(surface.restore_module(Builtins.PREVIEW_ID), "collapsed floating bar should restore")\n\tcheck_eq(\n\t\tsurface.get_floating_rect(Builtins.PREVIEW_ID),\n\t\tactual_float_rect,\n\t\t"restore should recover the complete pre-collapse rectangle"\n\t)\n''',
          )

          # P2-E Peek is a docked-collapse contract. Floating-origin collapse is now
          # intentionally an in-place title bar and therefore does not Peek.
          replace_once(
              'tests/unit/test_p2_e_workspace_visual_theme.gd',
              '''\tcheck_true(surface.collapse_module(Builtins.PREVIEW_ID), "Preview should collapse")\n\tcheck_eq(\n\t\tpreview.get_visual_state(), &"collapsed", "collapsed module should retain collapsed state"\n\t)\n\tcheck_true(surface.peek_module(Builtins.PREVIEW_ID), "collapsed Preview should Peek")\n''',
              '''\tcheck_true(\n\t\tsurface.dock_module(Builtins.PREVIEW_ID, DockLayout.DockZone.LEFT),\n\t\t"Preview should dock again before tray collapse"\n\t)\n\tcheck_true(surface.collapse_module(Builtins.PREVIEW_ID), "docked Preview should collapse")\n\tcheck_eq(\n\t\tpreview.get_visual_state(), &"collapsed", "collapsed module should retain collapsed state"\n\t)\n\tcheck_true(surface.peek_module(Builtins.PREVIEW_ID), "docked collapsed Preview should Peek")\n''',
          )
          PY
      - name: Format tests
        shell: bash
        run: |
          python3 -m pip install --quiet 'gdtoolkit>=4,<5'
          gdformat \
            tests/unit/test_p2_c_workspace_surface.gd \
            tests/unit/test_p2_e_workspace_visual_theme.gd \
            tests/unit/test_p2_g_live_workspace_migration.gd
      - name: Commit contracts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/test_p2_c_workspace_surface.gd \
                  tests/unit/test_p2_e_workspace_visual_theme.gd \
                  tests/unit/test_p2_g_live_workspace_migration.gd
          git diff --cached --quiet && exit 1
          git commit -m 'test: distinguish floating and docked collapse semantics'
          git push origin HEAD:codex/implement-p2-g-live-workspace-migration
