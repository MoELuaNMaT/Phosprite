name: P2-G Fix Helper

on:
  push:
    branches:
      - codex/implement-p2-g-live-workspace-migration

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/implement-p2-g-live-workspace-migration
      - name: Apply targeted P2-G fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path("src/UI/Workspace/WorkspaceEditorMigration.gd")
          text = migration.read_text()
          signal_block = "signal migration_completed\nsignal panel_visibility_changed(module_id: StringName, visible: bool)\n\n"
          if signal_block in text:
              text = text.replace(signal_block, "", 1)
              marker = 'const Builtins := preload("res://src/UI/Workspace/WorkspaceBuiltinModules.gd")\n'
              text = text.replace(marker, signal_block + marker, 1)
              migration.write_text(text)

          interaction = Path("src/UI/Workspace/WorkspaceInteractionController.gd")
          text = interaction.read_text()
          old = '''\t_pending_touch_travel += event.relative.length()\n\tvar elapsed := Time.get_ticks_msec() - _pending_touch_started_ms\n\tif elapsed < TOUCH_LONG_PRESS_MS:\n\t\tif _pending_touch_travel > TOUCH_CANCEL_DISTANCE:\n\t\t\t_clear_pending_touch()\n\t\tget_viewport().set_input_as_handled()\n\t\treturn\n\tif _pending_touch_travel > TOUCH_CANCEL_DISTANCE:\n\t\t_clear_pending_touch()\n\t\tget_viewport().set_input_as_handled()\n\t\treturn\n\tvar module_id := _pending_touch_module_id\n'''
          new = '''\tvar elapsed := Time.get_ticks_msec() - _pending_touch_started_ms\n\tif elapsed < TOUCH_LONG_PRESS_MS:\n\t\t_pending_touch_travel += event.relative.length()\n\t\tif _pending_touch_travel > TOUCH_CANCEL_DISTANCE:\n\t\t\t_clear_pending_touch()\n\t\tget_viewport().set_input_as_handled()\n\t\treturn\n\tvar module_id := _pending_touch_module_id\n'''
          if old not in text:
              raise SystemExit("P2-G touch acquisition block not found")
          interaction.write_text(text.replace(old, new, 1))
          PY
      - uses: Scony/godot-gdscript-toolkit@master
        with:
          version: 4.*
      - name: Format touched files
        run: |
          gdformat \
            src/UI/Workspace/WorkspaceEditorMigration.gd \
            src/UI/Workspace/WorkspaceInteractionController.gd
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "Targeted fixes already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/UI/Workspace/WorkspaceEditorMigration.gd \
            src/UI/Workspace/WorkspaceInteractionController.gd
          git commit -m "fix: harden P2-G live workspace migration"
          git push origin HEAD:codex/implement-p2-g-live-workspace-migration
