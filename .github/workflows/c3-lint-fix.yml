name: C3 lint fix

on:
  push:
    branches:
      - p1-c3-optional-rotation
    paths:
      - '.github/workflows/c3-lint-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: p1-c3-optional-rotation
      - name: Shorten tooltip line
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/InputAdapter/CanvasInputAdapter.gd')
          text = path.read_text()
          old = 'rotation_label.tooltip_text = ("Optional iPad navigation gesture. Disabled by default to keep canvas orientation stable.")'
          new = 'rotation_label.tooltip_text = "Optional iPad gesture. Disabled by default."'
          if old not in text:
              raise SystemExit('expected tooltip line not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/InputAdapter/CanvasInputAdapter.gd
          git commit -m "style: 修正 P1-C3 lint 行长"
          git push origin HEAD:p1-c3-optional-rotation
