name: P2-G iOS Dispatch Helper

on:
  push:
    branches:
      - codex/implement-p2-g-live-workspace-migration

permissions:
  actions: write
  contents: read

jobs:
  dispatch-ios:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing iOS workflow for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ios-build.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
