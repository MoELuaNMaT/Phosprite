name: iOS build (unsigned)

# P0-D：产出可在真机侧自行签名的未签名 IPA。
# Windows 主开发机无法构建 iOS，此 workflow 是唯一的 iOS 构建路径。
# 见 docs/phosprite_ipad_multiplatform_execution_plan.md 第 10.4 节。

on:
  push:
    branches: [ main, phosprite-main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main, phosprite-main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.3
  EXPORT_NAME: Phosprite
  SHARE_PLUGIN_VERSION: 5.2
  SHARE_PLUGIN_SHA256: 3bcc46dd250532067345812bc03d3e43d4013f3ffe08354217225b0affedb77f
  # 不需要导出模板目录变量:在 step 内用 $HOME 展开,env 的 ~ 不会被 shell 展开。

jobs:
  export-ios:
    name: iOS Export 📱
    runs-on: macos-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          submodules: true

      # Share Export 使用 Godot Mobile Plugins 的 MIT Share Plugin。
      # 固定 v5.2：该版本针对 Godot 4.6 构建；校验官方 release 的 SHA-256，
      # 避免 CI 静默获取变化的 native binary。插件只在 iOS 构建时注入，
      # Windows 主开发环境无需携带 xcframework。
      - name: Install pinned Godot Share plugin 📤
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_ZIP="${RUNNER_TEMP}/SharePlugin-iOS-v${SHARE_PLUGIN_VERSION}.zip"
          PLUGIN_DIR="${RUNNER_TEMP}/share-plugin"
          rm -rf "${PLUGIN_DIR}"
          mkdir -p "${PLUGIN_DIR}"
          curl -fL \
            "https://github.com/godot-mobile-plugins/godot-share/releases/download/v${SHARE_PLUGIN_VERSION}/SharePlugin-iOS-v${SHARE_PLUGIN_VERSION}.zip" \
            -o "${PLUGIN_ZIP}"
          echo "${SHARE_PLUGIN_SHA256}  ${PLUGIN_ZIP}" | shasum -a 256 -c -
          unzip -q "${PLUGIN_ZIP}" -d "${PLUGIN_DIR}"

          GDIP_PATH="$(find "${PLUGIN_DIR}" -path '*/ios/plugins/SharePlugin.gdip' -print -quit)"
          test -n "${GDIP_PATH}"
          PLUGIN_ROOT="${GDIP_PATH%/ios/plugins/SharePlugin.gdip}"
          test -f "${PLUGIN_ROOT}/addons/SharePlugin/plugin.cfg"
          test -d "${PLUGIN_ROOT}/ios/plugins/SharePlugin.xcframework"

          rsync -a "${PLUGIN_ROOT}/addons/" ./addons/
          mkdir -p ./ios/plugins
          rsync -a "${PLUGIN_ROOT}/ios/plugins/" ./ios/plugins/

          # The release contains both the runtime/native iOS plugin and an
          # EditorPlugin that supplies its frameworks/linker flags. Enable the
          # latter only in this CI checkout, and enable SharePlugin in preset.9.
          python3 - <<'PY'
          from pathlib import Path
          import re

          project_path = Path("project.godot")
          project = project_path.read_text(encoding="utf-8")
          plugin_cfg = '"res://addons/SharePlugin/plugin.cfg"'
          if plugin_cfg not in project:
              pattern = re.compile(r'(?m)^enabled=PackedStringArray\((.*)\)$')
              match = pattern.search(project)
              if not match:
                  raise SystemExit("editor_plugins/enabled not found in project.godot")
              existing = match.group(1).strip()
              replacement = f"enabled=PackedStringArray({existing}, {plugin_cfg})"
              project = project[:match.start()] + replacement + project[match.end():]
              project_path.write_text(project, encoding="utf-8")

          preset_path = Path("export_presets.cfg")
          presets = preset_path.read_text(encoding="utf-8")
          header = "[preset.9.options]"
          start = presets.find(header)
          if start < 0:
              raise SystemExit("iOS preset options not found")
          end = presets.find("\n[preset.", start + len(header))
          if end < 0:
              end = len(presets)
          section = presets[start:end]
          if "plugins/SharePlugin=true" not in section:
              marker = "\nentitlements/increased_memory_limit="
              insert_at = section.find(marker)
              if insert_at < 0:
                  raise SystemExit("iOS entitlement marker not found")
              section = section[:insert_at] + "\nplugins/SharePlugin=true\n" + section[insert_at:]
              presets = presets[:start] + section + presets[end:]
              preset_path.write_text(presets, encoding="utf-8")
          PY

          test -f ./ios/plugins/SharePlugin.gdip
          test -d ./ios/plugins/SharePlugin.xcframework
          grep -q 'res://addons/SharePlugin/plugin.cfg' project.godot
          grep -q 'plugins/SharePlugin=true' export_presets.cfg

      - name: Download and extract export templates 💾
        run: |
          TEMPLATES_DIR="${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -v -p "${TEMPLATES_DIR}"
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv ./templates/* "${TEMPLATES_DIR}"
          test -f "${TEMPLATES_DIR}/ios.zip"

      - name: Download Godot headless binary 🤖
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          chmod +x ./Godot.app/Contents/MacOS/Godot

      - name: Import resources once 📦
        continue-on-error: true
        run: ./Godot.app/Contents/MacOS/Godot --headless -v --import

      # Godot 导出的是 Xcode 工程，不是 .ipa（preset 中 application/export_project_only=true）。
      # 这样导出阶段完全不触及签名，签名与否由下面的 xcodebuild 决定。
      - name: Export Xcode project 🔧
        run: |
          mkdir -v -p ./build/ios
          ./Godot.app/Contents/MacOS/Godot --headless -v --export-release "iOS" ./build/ios/${EXPORT_NAME}.ipa

      - name: Verify SharePlugin export integration 🔎
        run: |
          PBXPROJ="./build/ios/${EXPORT_NAME}.xcodeproj/project.pbxproj"
          test -f "${PBXPROJ}"
          grep -q 'SharePlugin' "${PBXPROJ}"
          find ./build/ios -iname '*SharePlugin*' -print

      # 未签名 archive：CODE_SIGNING_ALLOWED=NO 让 xcodebuild 跳过所有签名与描述文件查找。
      - name: Build unsigned .xcarchive 🔧
        run: |
          xcodebuild -project ./build/ios/${EXPORT_NAME}.xcodeproj \
            -scheme ${EXPORT_NAME} \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/ios/${EXPORT_NAME}.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      # 把 .xcarchive 里已编译好的 .app 直接重打包成未签名 IPA。
      # 不走 -exportArchive：那一步强制要求可用的签名身份与 provisioning profile。
      - name: Package unsigned .ipa 📦
        run: |
          cd ./build/ios
          APP_PATH="${EXPORT_NAME}.xcarchive/Products/Applications/${EXPORT_NAME}.app"
          test -d "${APP_PATH}"
          rm -rf Payload
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          # 未签名包不应残留任何签名元数据。
          rm -rf Payload/${EXPORT_NAME}.app/_CodeSignature
          zip -qry ${EXPORT_NAME}-unsigned.ipa Payload
          rm -rf Payload
          ls -la ${EXPORT_NAME}-unsigned.ipa

      - name: Upload IPA artifact 🚀
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-ios-unsigned
          path: ./build/ios/${{ env.EXPORT_NAME }}-unsigned.ipa
          if-no-files-found: error

      - name: Upload Xcode project artifact 🚀
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-ios-xcode-project
          path: ./build/ios/
          retention-days: 7
