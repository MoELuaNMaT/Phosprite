name: iOS build (unsigned)

# 产出可在真机侧自行签名的未签名 IPA。
on:
  push:
    branches: [ main, phosprite-main, codex/implement-p3-project-gallery ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main, phosprite-main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.3
  EXPORT_NAME: Phosprite
  SHARE_PLUGIN_VERSION: 5.2
  SHARE_PLUGIN_SHA256: 3bcc46dd250532067345812bc03d3e43d4013f3ffe08354217225b0affedb77f

jobs:
  export-ios:
    name: iOS Export 📱
    runs-on: macos-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          submodules: true

      # P1-B Pointer Identity 只补 Godot 4.6.3 尚未暴露给 GDScript 的 UITouch.type。
      - name: Build pinned Pointer Identity plugin ✏️
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT="${RUNNER_TEMP}/phosprite-pointer-identity"
          rm -rf "${BUILD_ROOT}"
          git clone --depth 1 https://github.com/godot-sdk-integrations/godot-ios-plugins.git "${BUILD_ROOT}"
          rm -rf "${BUILD_ROOT}/godot"
          git clone --depth 1 --branch "${GODOT_VERSION}-stable" \
            https://github.com/godotengine/godot.git "${BUILD_ROOT}/godot"

          PLUGIN_DIR="${BUILD_ROOT}/plugins/phosprite_pointer_identity"
          mkdir -p "${PLUGIN_DIR}"
          cp ios/pointer_identity_src/phosprite_pointer_identity.h "${PLUGIN_DIR}/"
          cp ios/pointer_identity_src/phosprite_pointer_identity.mm "${PLUGIN_DIR}/"
          cp ios/pointer_identity_src/phosprite_pointer_identity_module.cpp "${PLUGIN_DIR}/"

          NATIVE_DOCS_DIR="${BUILD_ROOT}/plugins/phosprite_native_documents"
          mkdir -p "${NATIVE_DOCS_DIR}"
          cp ios/native_documents_src/phosprite_native_documents.h "${NATIVE_DOCS_DIR}/"
          cp ios/native_documents_src/phosprite_native_documents.mm "${NATIVE_DOCS_DIR}/"
          cp ios/native_documents_src/phosprite_native_documents_module.cpp "${NATIVE_DOCS_DIR}/"

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["RUNNER_TEMP"]) / "phosprite-pointer-identity" / "SConstruct"
          text = path.read_text(encoding="utf-8")
          needle = "'photo_picker']))"
          replacement = "'photo_picker', 'phosprite_pointer_identity', 'phosprite_native_documents']))"
          if needle not in text:
              raise SystemExit("Godot iOS plugin SConstruct plugin enum changed")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY

          python3 -m venv "${BUILD_ROOT}/.venv"
          source "${BUILD_ROOT}/.venv/bin/activate"
          python -m pip install --quiet scons
          cd "${BUILD_ROOT}"
          chmod +x scripts/timeout

          # godot-ios-plugins 的旧 generate_headers.sh 仍写死 release_debug；
          # Godot 4.6.3 已改为 editor/template_debug/template_release。
          # 继续复用同一个 90 秒中断器，但直接使用 4.6.3 的 template_debug。
          (
            cd godot
            ../scripts/timeout scons platform=ios target=template_debug
          ) || true
          test -f godot/core/version_generated.gen.h
          test -f godot/core/object/class_db.h

          scons \
            target=release \
            arch=arm64 \
            simulator=no \
            plugin=phosprite_pointer_identity \
            version=4.0 \
            target_path="${BUILD_ROOT}/bin/" \
            -j2

          LIB_PATH="$(find "${BUILD_ROOT}/bin" -name 'libphosprite_pointer_identity.arm64-ios.release.a' -print -quit)"
          test -n "${LIB_PATH}"
          cd "${GITHUB_WORKSPACE}"
          mkdir -p ios/plugins
          rm -rf ios/plugins/PhospritePointerIdentity.xcframework
          xcodebuild -create-xcframework \
            -library "${LIB_PATH}" \
            -output ios/plugins/PhospritePointerIdentity.xcframework
          cp ios/pointer_identity_src/PhospritePointerIdentity.gdip \
            ios/plugins/PhospritePointerIdentity.gdip
          test -f ios/plugins/PhospritePointerIdentity.gdip
          test -d ios/plugins/PhospritePointerIdentity.xcframework

          cd "${BUILD_ROOT}"
          scons \
            target=release \
            arch=arm64 \
            simulator=no \
            plugin=phosprite_native_documents \
            version=4.0 \
            target_path="${BUILD_ROOT}/bin/" \
            -j2

          NATIVE_DOCS_LIB="$(find "${BUILD_ROOT}/bin" -name 'libphosprite_native_documents.arm64-ios.release.a' -print -quit)"
          test -n "${NATIVE_DOCS_LIB}"
          cd "${GITHUB_WORKSPACE}"
          rm -rf ios/plugins/PhospriteNativeDocuments.xcframework
          xcodebuild -create-xcframework \
            -library "${NATIVE_DOCS_LIB}" \
            -output ios/plugins/PhospriteNativeDocuments.xcframework
          cp ios/native_documents_src/PhospriteNativeDocuments.gdip \
            ios/plugins/PhospriteNativeDocuments.gdip
          test -f ios/plugins/PhospriteNativeDocuments.gdip
          test -d ios/plugins/PhospriteNativeDocuments.xcframework

      - name: Install pinned Godot Share plugin 📤
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_ZIP="${RUNNER_TEMP}/SharePlugin-iOS-v${SHARE_PLUGIN_VERSION}.zip"
          PLUGIN_DIR="${RUNNER_TEMP}/share-plugin"
          rm -rf "${PLUGIN_DIR}"
          mkdir -p "${PLUGIN_DIR}"
          curl -fL \
            "https://github.com/godot-mobile-plugins/godot-share/releases/download/v${SHARE_PLUGIN_VERSION}/SharePlugin-iOS-v${SHARE_PLUGIN_VERSION}.zip" \
            -o "${PLUGIN_ZIP}"
          echo "${SHARE_PLUGIN_SHA256}  ${PLUGIN_ZIP}" | shasum -a 256 -c -
          unzip -q "${PLUGIN_ZIP}" -d "${PLUGIN_DIR}"

          GDIP_PATH="$(find "${PLUGIN_DIR}" -path '*/ios/plugins/SharePlugin.gdip' -print -quit)"
          test -n "${GDIP_PATH}"
          PLUGIN_ROOT="${GDIP_PATH%/ios/plugins/SharePlugin.gdip}"
          test -f "${PLUGIN_ROOT}/addons/SharePlugin/plugin.cfg"
          test -d "${PLUGIN_ROOT}/ios/plugins/SharePlugin.release.xcframework"
          test -d "${PLUGIN_ROOT}/ios/plugins/SharePlugin.debug.xcframework"

          rsync -a "${PLUGIN_ROOT}/addons/" ./addons/
          mkdir -p ./ios/plugins
          rsync -a "${PLUGIN_ROOT}/ios/plugins/" ./ios/plugins/

          python3 - <<'PY'
          from pathlib import Path
          import re

          project_path = Path("project.godot")
          project = project_path.read_text(encoding="utf-8")
          plugin_cfg = '"res://addons/SharePlugin/plugin.cfg"'
          if plugin_cfg not in project:
              pattern = re.compile(r'(?m)^enabled=PackedStringArray\((.*)\)$')
              match = pattern.search(project)
              if not match:
                  raise SystemExit("editor_plugins/enabled not found in project.godot")
              existing = match.group(1).strip()
              replacement = f"enabled=PackedStringArray({existing}, {plugin_cfg})"
              project = project[:match.start()] + replacement + project[match.end():]
              project_path.write_text(project, encoding="utf-8")

          preset_path = Path("export_presets.cfg")
          presets = preset_path.read_text(encoding="utf-8")
          header = "[preset.9.options]"
          start = presets.find(header)
          if start < 0:
              raise SystemExit("iOS preset options not found")
          end = presets.find("\n[preset.", start + len(header))
          if end < 0:
              end = len(presets)
          section = presets[start:end]
          required_plugins = (
              "plugins/SharePlugin=true",
              "plugins/PhospritePointerIdentity=true",
              "plugins/PhospriteNativeDocuments=true",
          )
          marker = "\nentitlements/increased_memory_limit="
          insert_at = section.find(marker)
          if insert_at < 0:
              raise SystemExit("iOS entitlement marker not found")
          additions = [line for line in required_plugins if line not in section]
          if additions:
              section = section[:insert_at] + "\n" + "\n".join(additions) + "\n" + section[insert_at:]
              presets = presets[:start] + section + presets[end:]
              preset_path.write_text(presets, encoding="utf-8")
          PY

          test -f ./ios/plugins/SharePlugin.gdip
          test -d ./ios/plugins/SharePlugin.release.xcframework
          test -d ./ios/plugins/SharePlugin.debug.xcframework
          test -f ./ios/plugins/PhospritePointerIdentity.gdip
          test -d ./ios/plugins/PhospritePointerIdentity.xcframework
          test -f ./ios/plugins/PhospriteNativeDocuments.gdip
          test -d ./ios/plugins/PhospriteNativeDocuments.xcframework
          grep -q 'res://addons/SharePlugin/plugin.cfg' project.godot
          grep -q 'plugins/SharePlugin=true' export_presets.cfg
          grep -q 'plugins/PhospritePointerIdentity=true' export_presets.cfg
          grep -q 'plugins/PhospriteNativeDocuments=true' export_presets.cfg

      - name: Download and extract export templates 💾
        run: |
          TEMPLATES_DIR="${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -v -p "${TEMPLATES_DIR}"
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv ./templates/* "${TEMPLATES_DIR}"
          test -f "${TEMPLATES_DIR}/ios.zip"

      - name: Download Godot headless binary 🤖
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          chmod +x ./Godot.app/Contents/MacOS/Godot

      - name: Import resources once 📦
        continue-on-error: true
        run: ./Godot.app/Contents/MacOS/Godot --headless -v --import

      - name: Export Xcode project 🔧
        run: |
          mkdir -v -p ./build/ios
          ./Godot.app/Contents/MacOS/Godot --headless -v --export-release "iOS" ./build/ios/${EXPORT_NAME}.ipa

      - name: Verify iOS plugin export integration 🔎
        run: |
          PBXPROJ="./build/ios/${EXPORT_NAME}.xcodeproj/project.pbxproj"
          test -f "${PBXPROJ}"
          grep -q 'SharePlugin' "${PBXPROJ}"
          grep -q 'PhospritePointerIdentity' "${PBXPROJ}"
          grep -q 'PhospriteNativeDocuments' "${PBXPROJ}"
          INFO_PLIST="./build/ios/${EXPORT_NAME}/${EXPORT_NAME}-Info.plist"
          test -f "${INFO_PLIST}"
          grep -q 'com.phosprite.project' "${INFO_PLIST}"
          grep -q 'com.phosprite.import.aseprite' "${INFO_PLIST}"
          grep -q 'CFBundleDocumentTypes' "${INFO_PLIST}"
          grep -q 'UIFileSharingEnabled' "${INFO_PLIST}"
          grep -q 'LSSupportsOpeningDocumentsInPlace' "${INFO_PLIST}"
          find ./build/ios -iname '*SharePlugin*' -print
          find ./build/ios -iname '*PhospritePointerIdentity*' -print
          find ./build/ios -iname '*PhospriteNativeDocuments*' -print

      - name: Build unsigned .xcarchive 🔧
        run: |
          xcodebuild -project ./build/ios/${EXPORT_NAME}.xcodeproj \
            -scheme ${EXPORT_NAME} \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/ios/${EXPORT_NAME}.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package unsigned .ipa 📦
        run: |
          cd ./build/ios
          APP_PATH="${EXPORT_NAME}.xcarchive/Products/Applications/${EXPORT_NAME}.app"
          test -d "${APP_PATH}"
          rm -rf Payload
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          rm -rf Payload/${EXPORT_NAME}.app/_CodeSignature
          zip -qry ${EXPORT_NAME}-unsigned.ipa Payload
          rm -rf Payload
          ls -la ${EXPORT_NAME}-unsigned.ipa

      - name: Upload IPA artifact 🚀
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-ios-unsigned
          path: ./build/ios/${{ env.EXPORT_NAME }}-unsigned.ipa
          if-no-files-found: error

      - name: Upload Xcode project artifact 🚀
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-ios-xcode-project
          path: ./build/ios/
          retention-days: 7
