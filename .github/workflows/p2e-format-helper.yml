name: P2-E Format Helper

on:
  push:
    branches:
      - codex/implement-p2-e-workspace-visual-theme

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/implement-p2-e-workspace-visual-theme
      - uses: Scony/godot-gdscript-toolkit@master
        with:
          version: 4.*
      - name: Format P2-E files
        run: |
          gdformat \
            src/UI/UI.gd \
            src/UI/Workspace/WorkspaceModule.gd \
            src/UI/Workspace/WorkspaceVisualTheme.gd \
            src/UI/Workspace/WorkspaceThemeController.gd \
            tests/unit/test_p2_e_workspace_visual_theme.gd
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/UI/UI.gd \
            src/UI/Workspace/WorkspaceModule.gd \
            src/UI/Workspace/WorkspaceVisualTheme.gd \
            src/UI/Workspace/WorkspaceThemeController.gd \
            tests/unit/test_p2_e_workspace_visual_theme.gd
          git commit -m "style: apply gdformat to P2-E"
          git push origin HEAD:codex/implement-p2-e-workspace-visual-theme
