name: P2-G Dock Workspace Format Helper

on:
  push:
    branches:
      - codex/implement-p2-g-live-workspace-migration
    paths:
      - ".github/workflows/p2g-dock-workspace-format-helper.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/implement-p2-g-live-workspace-migration
      - uses: Scony/godot-gdscript-toolkit@master
      - name: Format P2-G Dock Workspace files
        run: |
          gdformat             src/UI/Workspace/WorkspaceDockDragResolver.gd             src/UI/Workspace/WorkspaceInteractionController.gd             src/UI/Workspace/WorkspaceModule.gd             tests/unit/test_p2_b_workspace_dock_layout.gd             tests/unit/test_p2_c_workspace_surface.gd
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/UI/Workspace/WorkspaceDockDragResolver.gd             src/UI/Workspace/WorkspaceInteractionController.gd             src/UI/Workspace/WorkspaceModule.gd             tests/unit/test_p2_b_workspace_dock_layout.gd             tests/unit/test_p2_c_workspace_surface.gd
          git commit -m "P2-G: format dock workspace interactions"
          git push origin HEAD:codex/implement-p2-g-live-workspace-migration
