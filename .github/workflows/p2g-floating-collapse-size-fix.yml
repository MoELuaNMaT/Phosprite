name: P2-G Floating Collapse Size Fix

on:
  push:
    branches:
      - codex/implement-p2-g-live-workspace-migration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/implement-p2-g-live-workspace-migration
          fetch-depth: 0
      - name: Apply maximum-size guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/UI/Workspace/WorkspaceModule.gd')
          text = p.read_text(encoding='utf-8')
          old = '''var _content_is_external := false\nvar _content_collapsed := false\nvar _content_visible_before_collapse := true\n'''
          new = '''var _content_is_external := false\nvar _content_collapsed := false\nvar _content_visible_before_collapse := true\nvar _maximum_size_before_collapse := Vector2(-1.0, -1.0)\n'''
          if text.count(old) != 1:
              raise SystemExit('field anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''func set_content_collapsed(collapsed: bool) -> void:\n\tif _content_collapsed == collapsed:\n\t\treturn\n\tif is_instance_valid(content):\n\t\tif collapsed:\n\t\t\t_content_visible_before_collapse = content.visible\n\t\t\tcontent.visible = false\n\t\telse:\n\t\t\tcontent.visible = _content_visible_before_collapse\n\t_content_collapsed = collapsed\n\tif _visual_theme != null:\n\t\tapply_visual_theme(_visual_theme, _visual_state)\n\tqueue_redraw()\n'''
          new = '''func set_content_collapsed(collapsed: bool) -> void:\n\tif _content_collapsed == collapsed:\n\t\treturn\n\tif collapsed:\n\t\t_maximum_size_before_collapse = custom_maximum_size\n\t\tcustom_maximum_size = Vector2(maxf(size.x, INTERACTION_TARGET_SIZE), get_header_height())\n\tif is_instance_valid(content):\n\t\tif collapsed:\n\t\t\t_content_visible_before_collapse = content.visible\n\t\t\tcontent.visible = false\n\t\telse:\n\t\t\tcontent.visible = _content_visible_before_collapse\n\tif not collapsed:\n\t\tcustom_maximum_size = _maximum_size_before_collapse\n\t\t_maximum_size_before_collapse = Vector2(-1.0, -1.0)\n\t_content_collapsed = collapsed\n\tif _visual_theme != null:\n\t\tapply_visual_theme(_visual_theme, _visual_state)\n\tqueue_redraw()\n'''
          if text.count(old) != 1:
              raise SystemExit('collapse method anchor mismatch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format
        shell: bash
        run: |
          python3 -m pip install --quiet 'gdtoolkit>=4,<5'
          gdformat src/UI/Workspace/WorkspaceModule.gd
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/UI/Workspace/WorkspaceModule.gd
          git diff --cached --quiet && exit 1
          git commit -m 'fix: clamp collapsed floating panels to header height'
          git push origin HEAD:codex/implement-p2-g-live-workspace-migration
