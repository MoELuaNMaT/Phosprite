name: P2-G Restart Format Helper

on:
  push:
    branches:
      - codex/implement-p2-g-live-workspace-migration
    paths:
      - ".github/workflows/p2g-restart-format-helper.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/implement-p2-g-live-workspace-migration
      - uses: Scony/godot-gdscript-toolkit@master
      - name: Format restart regression test
        run: gdformat tests/unit/test_p2_g_live_workspace_migration.gd
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_p2_g_live_workspace_migration.gd
          git commit -m "P2-G: format restart regressions"
          git push origin HEAD:codex/implement-p2-g-live-workspace-migration
