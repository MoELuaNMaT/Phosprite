name: Static Checks 📊

on:
  push:
    branches:
      - master
      - main
      - phosprite-main
      - integration/phosprite-mainline
  pull_request:
    branches:
      - master
      - main
      - phosprite-main
    paths:
      - "addons/**"
      - "src/**"
      - "tests/**"
      - "project.godot"
      - "export_presets.cfg"
      - "scripts/ci/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: Scony/godot-gdscript-toolkit@master
      - name: Formatting checks
        run: gdformat --diff .
      - name: Linting checks
        run: gdlint .
      - name: Spell checks via codespell
        uses: codespell-project/actions-codespell@v2
        with:
          skip: ./addons,./Translations,./installer,./src/UI/Dialogs/AboutDialog.gd,./src/Classes/SoftwareParsers/PhotoshopParser.gd,./tests/fixtures
          ignore_words_list: chello,doubleclick,Manuel,SectionIn
